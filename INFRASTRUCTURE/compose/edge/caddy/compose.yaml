# Athena — Caddy (edge gateway)
#
#   Minimal-tier entry point. Routes all traffic to Open Notebook by default;
#   add `handle_path` blocks as more services join the stack (see Caddyfile).
#
#   Persistent state (certs, cache): ${ATHENA_DATA_DIR}/edge/caddy/{data,config}
services:
  caddy:
    image: caddy:2-alpine
    container_name: athena-caddy
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ATHENA_DATA_DIR:-./DATA}/edge/caddy/data:/data
      - ${ATHENA_DATA_DIR:-./DATA}/edge/caddy/config:/config

    networks:
      - athena

    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  athena:
    external: true
